<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Runtime Smoke Test</title></head>
<body>
<h1>Runtime Smoke</h1>
<label for="name-input">商品名称</label>
<input type="text" id="name-input" aria-label="商品名称" />
<label for="code-input">商品编码</label>
<input type="text" id="code-input" aria-label="商品编码" />
<input type="file" id="file-input" aria-label="上传文件" />
<button id="submit-btn" role="button">提交</button>
<button id="cancel-btn" role="button">取消</button>
<div id="result" aria-live="polite"></div>
<div id="toast" class="next-message" style="display:none"></div>
<table><tbody id="table-body"></tbody></table>
<script>
document.getElementById('submit-btn').addEventListener('click', function() {
  var name = document.getElementById('name-input').value;
  var code = document.getElementById('code-input').value;
  if (!name) { document.getElementById('toast').textContent='请填写名称'; document.getElementById('toast').style.display='block'; return; }
  document.getElementById('result').textContent = '已提交: ' + name;
  document.getElementById('toast').textContent = '提交成功';
  document.getElementById('toast').style.display = 'block';
  // 添加表格行
  var row = document.createElement('tr'); row.setAttribute('role','row');
  row.innerHTML = '<td>' + name + '</td><td>' + code + '</td>';
  document.getElementById('table-body').appendChild(row);
});
document.getElementById('cancel-btn').addEventListener('click', function() {
  document.getElementById('name-input').value = '';
  document.getElementById('code-input').value = '';
  document.getElementById('result').textContent = '';
});
</script>
</body></html>
